name: xnu

# Builds Apple's xnu-12377.121.6 (macOS 26.5 = the iOS 26 kernel generation) with
# blacktop/darwin-xnu-build, plus our patches from xnu/patches/ (applied strictly
# first: one failing patch fails the build). Artifact "xnu-kernel" = the kernel(s).

on:
  workflow_dispatch:
    inputs:
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG (ZEUS; VMAPPLE = stock comparison build)
        default: ZEUS
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [ios-27]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: "26.5"
  XNU_TAG: xnu-12377.121.6
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'ZEUS' }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script and xnu
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # build.sh skips its own clone when dxb/xnu exists
          git clone -q --depth 1 --branch "$XNU_TAG" https://github.com/apple-oss-distributions/xnu.git dxb/xnu
          git -C dxb/xnu log -1 --format='%H %s'

      - name: Apply our patches (strict)
        run: |
          cd dxb/xnu
          shopt -s nullglob
          for p in ../../xnu/patches/*.patch; do
            echo "== $p"
            git apply --check "$p"
            git apply "$p"
          done
          for s in ../../xnu/patches/*.sh; do
            echo "== $s"
            bash "$s"
          done
          git status --short | head -100

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          brew tap blacktop/tap && brew trust blacktop/tap || true
          brew install blacktop/tap/ipsw || true
          # build.sh only checks that xcodes exists; Xcode is preinstalled on the runner
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=/Applications/Xcode_26.1.app
          [ -d "$XC" ] || XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Closed KDK support libraries (what ZEUS has to replace)
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.os.*.a; do
            b=$(basename "$lib" .a)
            case "$b" in libVMAPPLE.os.DEVELOPMENT|libVMAPPLE.os.RELEASE) ;; *) continue ;; esac
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            nm -gU "$lib" | awk 'NF==3{print $3}' | sort -u > "out/kdk-libs/$b.defined.txt" || true
          done
          ls /Library/Developer/KDKs/*/System/Library/KernelSupport/ | head -50
          wc -l out/kdk-libs/* || true
          cat out/kdk-libs/libVMAPPLE.os.DEVELOPMENT.members.txt || true

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee ../build.log

      - name: Error summary
        if: always()
        run: |
          mkdir -p out
          # compact view of a 400 MB log: compiler errors, undefined symbols, failed make targets
          sed 's/\x1b\[[0-9;]*m//g' build.log > build.clean.log || true
          {
            echo "== compiler errors (count, file:line: message)"
            grep -oE '[A-Za-z0-9_/.+-]+\.(c|cpp|h|s|S|hpp|iig|defs):[0-9]+:[0-9]+: (fatal )?error: .{0,200}' build.clean.log \
              | sed -E 's|.*/xnu/||' | sort | uniq -c | sort -rn | head -150
            echo "== linker"
            grep -E 'Undefined symbols|referenced from|^ *"_[A-Za-z0-9_]+"|ld: (error|symbol)|linker command failed' build.clean.log | sort | uniq -c | sort -rn | head -300
            echo "== lines before each linker failure"
            grep -B 80 'linker command failed' build.clean.log | grep -v -- '-Wreserved-identifier\|note: expanded from' | tail -160
            echo "== lines before each failed make step (non-compiler failures)"
            grep -n -B 25 'make\[[0-9]*\]: \*\*\* ' build.clean.log | grep -v -- '-Wreserved-identifier\|note: expanded from\|usr/bin/clang \|^[0-9]*-  *[0-9]* |\|^[0-9]*-  *|' | cut -c1-400 | tail -120
            echo "== tool errors (kextsymboltool, exports, mig, iig)"
            grep -E 'kextsymboltool|undefined symbol|exports|symbol.*not found|No such file' build.clean.log | grep -vi warning | sort | uniq -c | sort -rn | head -40
            echo "== failed make targets"
            grep -oE 'make\[[0-9]+\]: \*\*\* \[[^]]+\] Error [0-9]+' build.clean.log | sort | uniq -c | head -100
            echo "== other errors"
            grep -E '^\S+ (error|ERROR|Error):|##\[error\]|\[error\]' build.clean.log | head -50
          } > out/errors.txt
          cat out/errors.txt

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && find . -maxdepth 1 -type f -name 'kernel.*' -exec shasum -a 256 {} + | tee SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
